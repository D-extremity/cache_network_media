name: cache_network_media
description: cached_network_image, but for SVG and Lottie too. Disk-cached network images, SVGs and Lottie animations with offline support, headers and download progress.
version: 2.0.0
homepage: https://github.com/D-extremity/cache_network_media
repository: https://github.com/D-extremity/cache_network_media
issue_tracker: https://github.com/D-extremity/cache_network_media/issues
screenshots:
  - description: An animated bird loaded from the disk cache with CacheNetworkMediaWidget.
    path: doc/demo.gif

topics:
  - cache
  - network
  - image
  - svg
  - lottie

environment:
  sdk: ^3.7.0
  flutter: '>=3.29.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.3
  flutter_svg: ^2.0.11
  lottie: ^3.2.0
  path_provider: ^2.1.0
  visibility_detector: ^0.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  lints: ^5.1.1
